<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Safarova Tours</title>
  <meta name="description" content="Discover Egypt with Safarova Tours.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" id="hero"></section>

    <section class="search-wrap container">
      <form class="search" id="search-form" autocomplete="off"></form>
    </section>

    <section class="features container" id="features"></section>

    <section class="section" id="tours">
      <div class="container">
        <div class="section-head" id="tours-head"></div>
        <p class="results-info" id="results-info" hidden></p>
        <div class="tour-grid" id="tour-grid"></div>
      </div>
    </section>

    <section class="why" id="about"></section>
  </main>

  <footer class="site-footer" id="contact"></footer>

  <script src="js/app.js"></script>
</body>
</html>
